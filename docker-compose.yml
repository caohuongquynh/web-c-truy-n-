services:
  db:
    image: mysql:8.0
    container_name: story-reading-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: story_reading_platform
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build: ./be
    container_name: story-reading-be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ghi đè datasource để backend nối tới container "db" thay vì "localhost"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/story_reading_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
    ports:
      - "8081:8081"

  fe:
    build: ./fe
    container_name: story-reading-fe
    restart: unless-stopped
    depends_on:
      - be
    ports:
      - "3000:80"

volumes:
  db_data:
