name: CI - Backend Tests

# Chạy pipeline này mỗi khi push code hoặc mở Pull Request vào các nhánh chính
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy code về máy chủ GitHub Actions
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài JDK 21 (khớp với java.version trong pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Chạy toàn bộ Unit Test + Integration Test bằng Maven
      # (test tự dùng H2 nhờ file be/src/test/resources/application.properties,
      # không cần MySQL thật trên máy chủ GitHub)
      - name: Run tests
        working-directory: ./be
        run: mvn -B test

      # Bước 4: Luôn lưu lại báo cáo kết quả test (kể cả khi có test fail),
      # để xem chi tiết test nào pass/fail ngay trên GitHub
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: be/target/surefire-reports/
