# File cấu hình này CHỈ áp dụng khi chạy test (Maven tự ưu tiên file trong
# src/test/resources hơn src/main/resources trong lúc test).
# Mục đích: test không cần MySQL thật đang chạy, dùng H2 (in-memory) thay thế.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Giá trị giả cho JWT/Cloudinary chỉ để ứng dụng khởi động được khi test,
# không cần giá trị thật
jwt.secret=test-secret-key-for-unit-and-integration-tests-only-1234567890
jwt.expiration-ms=3600000
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
